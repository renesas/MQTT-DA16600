build_renesas_ra:
  stage: build
  tags:
    - mqtt_periodic_publisher_Build_Test   # Registered runner tag
  script:
    - echo "the project directory is - $CI_PROJECT_DIR"
    - echo "the builb directory is - $CI_BUILDS_DIR"
    - echo "Change directory to the project directory..."
    - cd $CI_PROJECT_DIR\test\Unity_Test_MQTT_Periodic_Publisher_with_DA16600_On_FPB_RA6E2
    - echo "Starting CMake build..."
    - python build.py    
  # Keep build files:
  artifacts:
    expire_in: 3 day
    paths:
      - test/Unity_Test_MQTT_Periodic_Publisher_with_DA16600_On_FPB_RA6E2/build/Debug    
